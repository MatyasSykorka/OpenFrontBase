name: openfront
version: 1.0.0
description: Real-time telemetry provider for OpenFrontBase hardware front panel
author: Matyas
entrypoint: openfront
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - on_stream_start
  - on_stream_delta
  - on_stream_end
